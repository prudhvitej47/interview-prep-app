spring:
  application:
    name: interview-prep

  # Spring MVC on virtual threads: a blocking programming model that still holds thousands of
  # waiting requests on a 2 GB box without a thread pool to tune.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interviewprep}
    username: ${DB_USER:interviewprep}
    password: ${DB_PASSWORD:interviewprep}
    hikari:
      # Two vCPUs and one app instance: a large pool would only queue inside Postgres instead.
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
  # Mostly for the front end's larger lazy chunks: Mermaid, ELK and PGlite (10 MB of WebAssembly,
  # about 3.4 MB gzipped). Two users on a tailnet make the CPU cost of compressing trivial, and
  # the hashed assets are cached by the browser, so each file is compressed about once per release.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/wasm,application/octet-stream
  error:
    whitelabel:
      enabled: false

logging:
  level:
    org.flywaydb: INFO

app:
  content:
    # Where the curriculum bundle is read from at startup. Empty means "start with whatever is
    # already loaded", which is what a fresh checkout does. On the VM it is /bundle, mounted
    # read-only from the directory update.sh keeps current.
    bundle-dir: ${APP_CONTENT_BUNDLE_DIR:}
    # "Send to the curriculum" puts debriefs and articles on branches of the content repository.
    # The token (fine-grained: that repository only, contents read and write) lives only in
    # /etc/interview-prep/github.env on the VM. Unset, the page says sending is not set up.
    github-token: ${APP_GITHUB_TOKEN:}
    repo: ${APP_CONTENT_REPO:prudhvitej47/interview-prep-content}
