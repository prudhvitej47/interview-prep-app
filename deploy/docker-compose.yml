# What runs on the Lightsail VM. Deployed and updated by the units in this folder (PR 3).
#
# The VM has 1.9 GB of RAM and 2 GB of swap, so both containers carry explicit limits: without
# them the JVM and Postgres each size themselves against the whole machine and the kernel picks
# which one to kill.

services:
  postgres:
    image: postgres:18-trixie
    container_name: interview-prep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: interviewprep
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      # The dedicated 8 GB disk, mounted by the VM's first-boot script and owned by uid 999,
      # which is why this is the Debian image and not the Alpine one (uid 70).
      #
      # Postgres 18+ images want one mount at /var/lib/postgresql and put the cluster in a
      # version-named subdirectory, so pg_upgrade never crosses a mount boundary. Mounting at
      # /var/lib/postgresql/data instead makes the image refuse to start.
      #
      # Bind mount, never a named volume: `docker compose down -v` must not be able to reach it.
      - /data/postgres:/var/lib/postgresql
    # No ports section on purpose. Postgres is reachable only over the compose network.
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewprep -d interviewprep"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    container_name: interview-prep-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/interviewprep
      DB_USER: interviewprep
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_PROFILES_ACTIVE: vm
    # Bound to localhost: the only way in is `tailscale serve` on the host, which terminates
    # TLS for https://interview-prep.tail82d7a5.ts.net and forwards here.
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
