# What runs on the Lightsail VM. Deployed and updated by the units in this folder (PR 3).
#
# The VM has 1.9 GB of RAM and 2 GB of swap, so both containers carry explicit limits: without
# them the JVM and Postgres each size themselves against the whole machine and the kernel picks
# which one to kill.

services:
  postgres:
    image: postgres:18-trixie
    container_name: interview-prep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: interviewprep
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # WAL-G runs as PostgreSQL's archive_command, inside this container, so it reads its
      # credentials from here. Same key the VM already uses for backups; read-only on ECR and
      # write-only to the backup bucket.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set by /etc/interview-prep/backup.env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set by /etc/interview-prep/backup.env}
      AWS_REGION: ${AWS_REGION:?set by /etc/interview-prep/backup.env}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:?set by /etc/interview-prep/backup.env}
      # lz4 is WAL-G's default and costs almost no CPU. brotli compresses better but this box has
      # two vCPUs that PostgreSQL and the JVM are already sharing.
      WALG_COMPRESSION_METHOD: lz4
      # Default is 16, which sizes its buffers for a dedicated backup host rather than a container
      # sharing 512 MB with the database.
      WALG_UPLOAD_CONCURRENCY: "2"
    # archive_mode is a postmaster setting, so it can only be turned on by a restart — which is
    # what recreating this container does.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      # Ships a segment at least every five minutes even when the database is idle, so the worst
      # case is five minutes of loss rather than however long until 16 MB of WAL accumulates.
      - archive_timeout=300
    volumes:
      # The dedicated 8 GB disk, mounted by the VM's first-boot script and owned by uid 999,
      # which is why this is the Debian image and not the Alpine one (uid 70).
      #
      # Postgres 18+ images want one mount at /var/lib/postgresql and put the cluster in a
      # version-named subdirectory, so pg_upgrade never crosses a mount boundary. Mounting at
      # /var/lib/postgresql/data instead makes the image refuse to start.
      #
      # Bind mount, never a named volume: `docker compose down -v` must not be able to reach it.
      - /data/postgres:/var/lib/postgresql
      # A single static binary, installed on the VM by vm-setup.sh. Mounting it avoids building
      # and publishing our own PostgreSQL image just to add one file.
      - /opt/interview-prep/bin/wal-g:/usr/local/bin/wal-g:ro
      # The postgres image ships no CA bundle, so WAL-G cannot verify S3's certificate. It does
      # not fail usefully either: every TLS handshake fails, the AWS SDK retries with exponential
      # backoff, and wal-push simply hangs until something times it out. Mounting the host's
      # bundle is the whole fix.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # No ports section on purpose. Postgres is reachable only over the compose network.
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewprep -d interviewprep"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    container_name: interview-prep-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/interviewprep
      DB_USER: interviewprep
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    # Bound to localhost: the only way in is `tailscale serve` on the host, which terminates
    # TLS for https://interview-prep.tail82d7a5.ts.net and forwards here.
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
