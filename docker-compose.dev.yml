# Postgres and the code runner for local development on the Mac. Run the app itself from your IDE or
# with `./mvnw spring-boot:run` in backend/ (add RUNNER_URL=http://localhost:8090 for Run and Submit),
# and the front end with `npm run dev` in frontend/.
#
# The runner is built from your packaged jar, so package first and rebuild after runner changes:
#   (cd backend && ./mvnw -q package -DskipTests) && docker compose -f docker-compose.dev.yml up -d --build
#
# Published ports are bound to localhost so nothing on the local network can reach them.

services:
  postgres:
    image: postgres:18-trixie
    container_name: interview-prep-postgres-dev
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: interviewprep
      POSTGRES_PASSWORD: interviewprep
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images want one mount at /var/lib/postgresql and place the cluster in a
      # version-named subdirectory beneath it, so pg_upgrade never crosses a mount boundary.
      - dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewprep -d interviewprep"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The JDK that learners' code runs in, pinned like deploy/sandbox-image. The runner starts sandboxes
  # with --pull never, so the image must already be here: this service only makes `up` pull it, then
  # exits at once.
  sandbox-image:
    image: eclipse-temurin:25-jdk-noble@sha256:a75cd2f1bd3e1e45da898bf658f1f1039ab7392b34844862514d230fd6a516d4
    container_name: interview-prep-sandbox-image-dev
    entrypoint: ["true"]
    restart: "no"

  # The code runner, as on the VM (deploy/docker-compose.yml) but published on localhost:8090 for an
  # app started outside Compose. It runs as root here because Docker Desktop's socket is root-only
  # inside its VM; on the VM it joins the docker group instead.
  runner:
    build: .
    image: interview-prep-app:dev
    container_name: interview-prep-runner-dev
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    user: root
    entrypoint:
      - java
      - -Xmx48m
      - -XX:+ExitOnOutOfMemoryError
      - -cp
      - /app/BOOT-INF/classes:/app/BOOT-INF/lib/*
      - com.interviewprep.runner.RunnerMain
    environment:
      RUNNER_PORT: "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  dev-pgdata:
