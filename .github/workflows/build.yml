name: build

# Builds and tests the whole thing on every pull request: the React app, the Spring Boot app, the
# module boundaries, the migrations against a real Postgres, and the container image.
#
# Pull requests only. Pushes to main are covered by the publish workflow, which runs the same
# checks before it publishes anything, so building here as well would just do it twice.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Node is installed by frontend-maven-plugin at the version pinned in backend/pom.xml,
      # so CI and the Mac build the front end identically. Only npm's cache is shared here.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Testcontainers needs a Docker daemon; ubuntu-latest runners already have one.
      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

      # Uses the jar the step above just built, and rehearses the publish workflow's image build
      # closely enough to catch its failures here rather than on main. Only the push differs.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
          retention-days: 7
